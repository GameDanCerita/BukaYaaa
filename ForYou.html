<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💖✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* 
             * GANTI BACKGROUND FOTO DI SINI! 
             * Ubah 'foto-kita.jpg' dengan nama file foto kamu.
             */
            background-image: url('https://i.imgur.com/W4metor.jpeg'), linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply; /* Membuat foto sedikit redup agar teks tetap terbaca */
            background-color: rgba(255, 182, 193, 0.4); 
            
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Diperlukan untuk efek 3D flip */
        }

        /* Container utama dengan efek 3D Card Glassmorphism */
        .container {
            position: relative;
            width: 90%;
            max-width: 420px;
            height: 520px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        /* Halaman Base */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backface-visibility: hidden;
        }

        /* Status Tampilan Halaman (Animasi 3D Flip) */
        .page.hidden-left {
            transform: rotateY(-180deg) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .page.hidden-right {
            transform: rotateY(180deg) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .page.active {
            transform: rotateY(0deg) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Hiasan Emoji Floating */
        .floating-emoji {
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
            margin-bottom: 10px;
            display: inline-block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        /* Typography */
        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #ff4757;
            margin-bottom: 15px;
            min-height: 35px;
        }

        /* Kotak Pesan Halaman 2 & 3 */
        .message-box {
            background: rgba(255, 245, 247, 0.9);
            border: 2px dashed #ff6b81;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 20px;
            width: 100%;
            max-height: 280px;
            overflow-y: auto; /* Bisa discroll jika kepanjangan */
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3);
        }

        /* Custom Scrollbar */
        .message-box::-webkit-scrollbar {
            width: 6px;
        }
        .message-box::-webkit-scrollbar-thumb {
            background: #ff6b81;
            border-radius: 10px;
        }

        .message-box p {
            color: #57606f;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .message-box .to {
            font-weight: 600;
            color: #ff4757;
            margin-top: 10px;
            font-style: italic;
        }

        /* Container Tombol Navigasi */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            opacity: 0; /* Disembunyikan sampai teks selesai diketik */
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Tombol */
        button {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        button.btn-secondary {
            background: #f1f2f6;
            color: #2f3542;
            box-shadow: none;
        }

        button.btn-secondary:hover {
            background: #dfe4ea;
        }

        .wa-btn {
            background: linear-gradient(45deg, #25D366, #128C7E);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            width: 100%;
        }

        .wa-btn:hover {
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.6);
        }

        /* Cursor Mengetik */
        .cursor::after {
            content: '|';
            animation: blink 0.8s infinite;
            color: #ff4757;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Halaman 1: Cover -->
        <div id="page1" class="page active">
            <div class="floating-emoji">💌</div>
            <h1 class="typing-text" data-text="Haiii, Ellllll! 💖"></h1>
            <p class="typing-text" data-text="Ada pesan rahasia yang manis banget nih buat kamu... Mau baca sekarang? 🫣" style="color: #747d8c; font-size: 14px; min-height: 45px;"></p>
            <div class="btn-group">
                <button onclick="changePage(1, 2)">Buka Pesan 🎁</button>
            </div>
        </div>

        <!-- Halaman 2: Pesan Pendek -->
        <div id="page2" class="page hidden-right">
            <div class="floating-emoji">🧸🌸</div>
            <div class="message-box">
                <p class="typing-text" data-text="Jujur, selama sama lu dunia gua lebih cerah lagi tauuu! ✨"></p>
                <p class="typing-text" data-text="Gatau kenapa tapi itu beneran, mood gua jauh lebih baik ketika lagi bareng luuu... 🥰"></p>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="changePage(2, 1)">⬅️</button>
                <button onclick="changePage(2, 3)">Lanjut ➡️</button>
            </div>
        </div>

        <!-- Halaman 3: Curhatan Zaky -->
        <div id="page3" class="page hidden-right">
            <div class="floating-emoji">🌻</div>
            <div class="message-box">
                <p class="typing-text" data-text="Makasiiii ya udah selalu ada dan bikin hari-hari gua jauh lebih berwarna dari sebelumnya. Kadang gua suka senyum-senyum sendiri pas lagi sendirian, terus inget obrolan kita, candaan random kita, atau hal-hal kecil yang kita lakuin bareng."></p>
                <p class="typing-text" data-text="Rasanya kayak semua capek, stres, dan beban pikiran tuh langsung ilang gitu aja tiap kali lagi bareng atau ngobrol sama luuuuu."></p>
                <p class="typing-text" data-text="Lu selalu tahu gimana caranya bikin suasana jadi lebih hidup, bahkan di hari-hari gua yang lagi bosen atau penat. Kehadiran lu bener-bener ngasih pengaruh yang positif banget buat hidup gua, dan gua pengen lu tahu itu."></p>
                <p class="typing-text" data-text="Plisssss jangannnn pernaaaaa boseennnn samaaaa guaaaaa 😭❤️"></p>
                <p class="typing-text to" data-text="From : Zaky Ardan Syahreza yang tampan 😎"></p>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="changePage(3, 2)">⬅️</button>
                <button onclick="changePage(3, 4)">Lanjut ➡️</button>
            </div>
        </div>

        <!-- Halaman 4: Nembak -->
        <div id="page4" class="page hidden-right">
            <div class="floating-emoji">👉👈💕</div>
            <h1 class="typing-text" data-text="Eumm...."></h1>
            <p class="typing-text" data-text="Lu mau gaa jadii pacarr guaa.. plss.. 🥺❤️" style="color: #ff4757; font-size: 18px; font-weight: 600; min-height: 55px; margin-bottom: 20px;"></p>
            <div class="btn-group" style="flex-direction: column; width: 80%;">
                <!-- TOMBOL WHATSAPP (Akan mengirim pesan otomatis ke nomormu) -->
                <a href="https://api.whatsapp.com/send?phone=6283125467171&text=Iyaaa%20Zaky,%20aku%20mau%20kok%20jadi%20pacar%20kamu!%20%E2%9D%A4%EF%B8%8F%F0%9F%A5%B0" target="_blank" style="text-decoration: none; width: 100%;">
                    <button class="wa-btn">Iyaa, Aku Mau! 💬</button>
                </a>
                <button class="btn-secondary" onclick="changePage(4, 3)" style="width: 100%; margin-top: 5px;">⬅️ Kembali</button>
            </div>
        </div>
    </div>

    <script>
        let typingTimeouts = []; // Menyimpan timeout agar animasi mengetik bisa dibatalkan

        // Fungsi untuk membersihkan animasi mengetik sebelumnya
        function clearTyping() {
            typingTimeouts.forEach(timeout => clearTimeout(timeout));
            typingTimeouts = [];
        }

        // Fungsi utama animasi mengetik per elemen
        function typeSentence(element, text) {
            return new Promise(resolve => {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        // Kecepatan mengetik (30ms per huruf)
                        let timeout = setTimeout(type, 30);
                        typingTimeouts.push(timeout);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        // Fungsi untuk menjalankan animasi di halaman yang sedang aktif
        async function playTyping(pageId) {
            const page = document.getElementById(pageId);
            const textElements = page.querySelectorAll('.typing-text');
            const btnGroup = page.querySelector('.btn-group');

            // Sembunyikan tombol saat sedang mengetik
            if (btnGroup) {
                btnGroup.style.opacity = '0';
                btnGroup.style.pointerEvents = 'none';
            }

            // Kosongkan teks sebelum diketik ulang
            textElements.forEach(el => {
                el.innerHTML = '';
                el.classList.remove('cursor');
            });

            // Jalankan mengetik satu per satu
            for (let i = 0; i < textElements.length; i++) {
                const el = textElements[i];
                const text = el.getAttribute('data-text');
                el.classList.add('cursor'); // Munculkan kursor berkedip
                await typeSentence(el, text);
                el.classList.remove('cursor'); // Hapus kursor setelah selesai baris ini
            }

            // Munculkan tombol setelah semua teks selesai diketik
            if (btnGroup) {
                btnGroup.style.opacity = '1';
                btnGroup.style.pointerEvents = 'auto';
            }
        }

        // Fungsi ganti halaman
        function changePage(current, next) {
            clearTyping(); // Hentikan animasi mengetik jika sedang berjalan

            const currentPage = document.getElementById(`page${current}`);
            const nextPage = document.getElementById(`page${next}`);

            // Arah animasi (Ke Kiri atau Ke Kanan)
            if (next > current) {
                currentPage.className = 'page hidden-left';
            } else {
                currentPage.className = 'page hidden-right';
            }

            nextPage.className = 'page active';

            // Beri sedikit jeda waktu (600ms) untuk animasi flip, baru mulai mengetik
            setTimeout(() => {
                playTyping(`page${next}`);
            }, 600);
        }

        // Jalankan animasi mengetik di halaman 1 saat pertama kali web dibuka
        window.onload = () => {
            playTyping('page1');
        };
    </script>

</body>
</html>
